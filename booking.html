<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رزرو نوبت | Pari Lash Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.css">


   <style>
  /* ===== ظاهر پررنگ‌تر و لوکس‌تر ===== */

body{
    background:
        radial-gradient(circle at 0% 0%, #ffc1dc 0, transparent 32%),
        radial-gradient(circle at 100% 100%, #ffd7e8 0, transparent 35%),
        linear-gradient(135deg,#fff0f6,#fff7fa,#ffeaf3);
}


/* کارت */

.container{
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.97),
        rgba(255,242,248,.94)
    );

    border:2px solid #f5bfd5;

    box-shadow:
        0 20px 60px rgba(180,70,115,.20),
        0 0 35px rgba(255,105,165,.20);
}


/* لوگو */

.logo{
    color:#d0447c;

    text-shadow:
        0 2px 12px rgba(210,55,115,.18);
}


/* عنوان */

h1{
    color:#c23870;

    text-shadow:
        0 3px 15px rgba(190,50,105,.15);
}


/* متن */

.subtitle{
    color:#a95576;
}


/* برچسب ها */

.form-group label{
    color:#9a3f67;
}


/* فیلدها */

input,
select,
textarea{

    background:#fff5f9;

    border:2px solid #f4c0d5;

    box-shadow:
        inset 0 2px 8px rgba(220,80,130,.04),
        0 5px 15px rgba(190,70,115,.06);
}


input:focus,
select:focus,
textarea:focus{

    border-color:#e94d8b;

    background:#fff;

    box-shadow:
        0 0 0 4px rgba(235,77,139,.15),
        0 8px 25px rgba(190,65,115,.12);
}


/* دکمه */

button[type="submit"]{

    background:
        linear-gradient(
            135deg,
            #d93678 0%,
            #ed5795 45%,
            #ff8fbd 100%
        );

    box-shadow:
        0 12px 30px rgba(214,45,112,.38),
        0 0 25px rgba(255,100,165,.25);
}


button[type="submit"]:hover{

    background:
        linear-gradient(
            135deg,
            #c92e6e,
            #e74789,
            #ff7eb3
        );

    box-shadow:
        0 16px 38px rgba(210,40,105,.48),
        0 0 35px rgba(255,100,165,.38);
}


/* لینک بازگشت */

.back{
    color:#c13e73;
    font-weight:700;
}  



</style>



            


</head>

<body>

<div class="container">

    <div class="logo">
        PARI LASH STUDIO
    </div>

    <h1>
        رزرو نوبت ✨
    </h1>

    <div class="subtitle">
        برای ثبت نوبت، اطلاعات خود را وارد کنید.
        <br>
        منتظر دیدارتان هستیم 🌸
    </div>

    <form id="bookingForm">

        <div class="form-group">

            <label for="name">
                نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="name"
                placeholder="مثلاً پری رضایی"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                شماره تماس
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="مثلاً 09123456789"
                required
            >

        </div>


        <div class="form-group">

            <label for="date">
                تاریخ موردنظر
            </label>

            <input
                type="text"
                id="date"
                placeholder="انتخاب تاریخ 📅"
                data-jdp
                autocomplete="off"
                readonly
                required
            >

        </div>


        <div class="form-group">

            <label for="service">
                نوع خدمات
            </label>

            <select id="service" required>

                <option value="">
                    انتخاب خدمات
                </option>

                <option value="اکستنشن مژه">
                    اکستنشن مژه
                </option>

                <option value="ترمیم مژه">
                    ترمیم مژه
                </option>

                <option value="لیفت مژه">
                    لیفت مژه
                </option>

                <option value="سایر">
                    سایر
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="description">
                توضیحات
            </label>

            <textarea
                id="description"
                placeholder="اگر توضیح خاصی دارید اینجا بنویسید..."
            ></textarea>

        </div>


        <button
            type="submit"
            id="submitBtn"
        >
            ثبت درخواست نوبت ✨
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back"
    >
        ← بازگشت به صفحه اصلی
    </a>

</div>


<!-- تقویم شمسی -->

<script src="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

<script>

jalaliDatepicker.startWatch({
    minDate: "attr",
    maxDate: "attr"
});

</script>


<!-- Firebase -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCn_Rx6fdxUO_E2eIYjNQaiPamSMntmshc",

    authDomain: "pari-lash-studio.firebaseapp.com",

    projectId: "pari-lash-studio",

    storageBucket: "pari-lash-studio.firebasestorage.app",

    messagingSenderId: "345811477312",

    appId: "1:345811477312:web:77b060a885ede8461490a5"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const form =
    document.getElementById("bookingForm");


const button =
    document.getElementById("submitBtn");


const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        button.disabled = true;

        button.textContent =
            "در حال ثبت...";


        message.className =
            "message";

        message.textContent = "";


        const name =
            document.getElementById("name")
            .value.trim();


        const phone =
            document.getElementById("phone")
            .value.trim();


        const date =
            document.getElementById("date")
            .value;


        const service =
            document.getElementById("service")
            .value;


        const description =
            document.getElementById("description")
            .value.trim();


        try{

            await addDoc(
                collection(db,"bookings"),
                {

                    name:name,

                    phone:phone,

                    date:date,

                    service:service,

                    description:description,

                    status:"در انتظار بررسی",

                    createdAt:
                        serverTimestamp()

                }
            );


            message.className =
                "message success";


            message.textContent =
                "درخواست شما با موفقیت ثبت شد 🌸";


            form.reset();


        }catch(error){

            console.error(error);


            message.className =
                "message error";


            message.textContent =
                "ثبت درخواست انجام نشد. لطفاً دوباره امتحان کنید.";

        }


        button.disabled = false;


        button.textContent =
            "ثبت درخواست نوبت ✨";

    }
);

</script>

</body>
</html>
