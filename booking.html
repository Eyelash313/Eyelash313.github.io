<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رزرو نوبت | Pari Lash Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:28px 15px;
    font-family:"Vazirmatn",Tahoma,sans-serif;
    color:#49363f;

    background:
        radial-gradient(circle at 15% 15%,rgba(255,190,220,.45),transparent 28%),
        radial-gradient(circle at 85% 85%,rgba(230,190,215,.35),transparent 30%),
        linear-gradient(135deg,#fff7fb,#f8edf4);
}

/* کارت اصلی */

.container{
    width:100%;
    max-width:520px;
    margin:15px auto;

    padding:34px 27px 28px;

    background:rgba(255,255,255,.78);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,.9);
    border-radius:30px;

    box-shadow:
        0 20px 55px rgba(121,76,101,.13),
        inset 0 1px 0 rgba(255,255,255,.8);
}

/* لوگو */

.logo{
    text-align:center;
    font-family:"Playfair Display",serif;
    letter-spacing:3px;
    font-size:15px;
    color:#b77b98;
    margin-bottom:10px;
}

/* عنوان */

h1{
    margin:0;
    text-align:center;
    font-size:29px;
    font-weight:700;
    color:#4c3540;
}

.subtitle{
    margin:9px auto 30px;
    max-width:380px;
    text-align:center;
    line-height:1.9;
    color:#947d88;
    font-size:13px;
}

/* فرم */

.form-group{
    margin-bottom:19px;
}

label{
    display:block;
    margin-bottom:8px;
    padding-right:3px;

    font-size:14px;
    font-weight:600;
    color:#59434d;
}

/* ورودی ها */

input,
textarea,
select{
    width:100%;
    border:1px solid #ead8e1;
    border-radius:15px;

    background:rgba(255,255,255,.9);
    color:#493b42;

    padding:14px 15px;

    font-family:inherit;
    font-size:14px;

    outline:none;

    transition:
        border-color .25s,
        box-shadow .25s,
        transform .2s;
}

input::placeholder,
textarea::placeholder{
    color:#b5a3ab;
}

input:hover,
textarea:hover,
select:hover{
    border-color:#d9aec3;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#d58faf;

    box-shadow:
        0 0 0 4px rgba(213,143,175,.12),
        0 7px 18px rgba(160,103,133,.07);

    transform:translateY(-1px);
}

textarea{
    min-height:105px;
    resize:vertical;
    line-height:1.8;
}

/* کادر تاریخ */

#date{
    cursor:pointer;
    background:#fff;
}

/* دکمه ثبت */

button{
    width:100%;
    border:0;
    border-radius:16px;

    padding:16px 20px;

    background:
        linear-gradient(
            135deg,
            #d96f9e 0%,
            #c75d8d 48%,
            #b94f80 100%
        );

    color:#fff;

    font-family:inherit;
    font-size:16px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 24px rgba(190,82,128,.25),
        inset 0 1px 0 rgba(255,255,255,.25);

    transition:
        transform .2s,
        box-shadow .2s;
}

button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 30px rgba(190,82,128,.34),
        inset 0 1px 0 rgba(255,255,255,.3);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* پیام */

.message{
    display:none;
    margin-top:18px;
    padding:14px;

    border-radius:14px;

    text-align:center;
    font-size:14px;
    line-height:1.7;
}

.success{
    display:block;
    background:#f0faf4;
    color:#397452;
    border:1px solid #d5efdf;
}

.error{
    display:block;
    background:#fff2f3;
    color:#9b4a55;
    border:1px solid #f2d7da;
}

/* برگشت */

.back{
    display:block;

    width:max-content;
    margin:22px auto 0;

    color:#a16f88;
    text-decoration:none;

    font-size:13px;

    transition:.2s;
}

.back:hover{
    color:#c65d8b;
    transform:translateY(-1px);
}

/* ظاهر تقویم */

.jdp-container{
    font-family:"Vazirmatn",Tahoma,sans-serif !important;
    border-radius:16px !important;
    box-shadow:0 15px 40px rgba(90,55,75,.18) !important;
}

/* موبایل */

@media(max-width:480px){

    body{
        padding:15px 10px;
    }

    .container{
        margin:8px auto;
        padding:28px 19px 24px;
        border-radius:25px;
    }

    h1{
        font-size:26px;
    }

    .subtitle{
        margin-bottom:25px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        PARI LASH STUDIO
    </div>

    <h1>
        رزرو نوبت ✨
    </h1>

    <div class="subtitle">
        برای ثبت نوبت، اطلاعات خود را وارد کنید.
        <br>
        منتظر دیدارتان هستیم 🌸
    </div>

    <form id="bookingForm">

        <div class="form-group">

            <label for="name">
                نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="name"
                placeholder="مثلاً پری رضایی"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                شماره تماس
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="مثلاً 09123456789"
                required
            >

        </div>


        <div class="form-group">

            <label for="date">
                تاریخ موردنظر
            </label>

            <input
                type="text"
                id="date"
                placeholder="انتخاب تاریخ 📅"
                data-jdp
                autocomplete="off"
                readonly
                required
            >

        </div>


        <div class="form-group">

            <label for="service">
                نوع خدمات
            </label>

            <select id="service" required>

                <option value="">
                    انتخاب خدمات
                </option>

                <option value="اکستنشن مژه">
                    اکستنشن مژه
                </option>

                <option value="ترمیم مژه">
                    ترمیم مژه
                </option>

                <option value="لیفت مژه">
                    لیفت مژه
                </option>

                <option value="سایر">
                    سایر
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="description">
                توضیحات
            </label>

            <textarea
                id="description"
                placeholder="اگر توضیح خاصی دارید اینجا بنویسید..."
            ></textarea>

        </div>


        <button
            type="submit"
            id="submitBtn"
        >
            ثبت درخواست نوبت ✨
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back"
    >
        ← بازگشت به صفحه اصلی
    </a>

</div>


<!-- تقویم شمسی -->

<script src="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

<script>

jalaliDatepicker.startWatch({
    minDate: "attr",
    maxDate: "attr"
});

</script>


<!-- Firebase -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCn_Rx6fdxUO_E2eIYjNQaiPamSMntmshc",

    authDomain: "pari-lash-studio.firebaseapp.com",

    projectId: "pari-lash-studio",

    storageBucket: "pari-lash-studio.firebasestorage.app",

    messagingSenderId: "345811477312",

    appId: "1:345811477312:web:77b060a885ede8461490a5"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const form =
    document.getElementById("bookingForm");


const button =
    document.getElementById("submitBtn");


const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        button.disabled = true;

        button.textContent =
            "در حال ثبت...";


        message.className =
            "message";

        message.textContent = "";


        const name =
            document.getElementById("name")
            .value.trim();


        const phone =
            document.getElementById("phone")
            .value.trim();


        const date =
            document.getElementById("date")
            .value;


        const service =
            document.getElementById("service")
            .value;


        const description =
            document.getElementById("description")
            .value.trim();


        try{

            await addDoc(
                collection(db,"bookings"),
                {

                    name:name,

                    phone:phone,

                    date:date,

                    service:service,

                    description:description,

                    status:"در انتظار بررسی",

                    createdAt:
                        serverTimestamp()

                }
            );


            message.className =
                "message success";


            message.textContent =
                "درخواست شما با موفقیت ثبت شد 🌸";


            form.reset();


        }catch(error){

            console.error(error);


            message.className =
                "message error";


            message.textContent =
                "ثبت درخواست انجام نشد. لطفاً دوباره امتحان کنید.";

        }


        button.disabled = false;


        button.textContent =
            "ثبت درخواست نوبت ✨";

    }
);

</script>

</body>
</html>
