<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رزرو نوبت | Pari Lash Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.css">

<style>

   <style>

/* ===== پس زمینه ===== */

body{
    margin:0;
    padding:25px 15px;
    min-height:100vh;

    font-family:"Vazirmatn",sans-serif;

    background:
        radial-gradient(circle at 10% 10%, rgba(255,190,220,.55), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(255,220,235,.7), transparent 40%),
        linear-gradient(145deg,#fff7fa,#fff,#fff4f8);

    color:#5b3b4a;
}


/* ===== کارت اصلی ===== */

.booking-card{
    width:100%;
    max-width:520px;
    margin:auto;

    padding:30px 25px;

    box-sizing:border-box;

    background:rgba(255,255,255,.88);

    border:1px solid rgba(255,170,205,.35);

    border-radius:30px;

    box-shadow:
        0 20px 55px rgba(120,60,90,.13),
        0 0 30px rgba(255,150,195,.12);

    backdrop-filter:blur(12px);
}


/* ===== عنوان ===== */

h1{
    margin:0;
    text-align:center;

    font-family:"Playfair Display","Vazirmatn",serif;

    font-size:32px;

    color:#9b4f72;

    letter-spacing:.5px;
}

.booking-subtitle{
    text-align:center;
    margin:8px 0 28px;

    color:#b47a91;
    font-size:14px;
}


/* ===== خط تزئینی ===== */

.booking-line{
    width:70px;
    height:3px;

    margin:12px auto 25px;

    border-radius:10px;

    background:linear-gradient(90deg,#ff8fbd,#ffd0e2,#ff8fbd);
}


/* ===== گروه فرم ===== */

.form-group{
    margin-bottom:19px;
}

.form-group label{
    display:block;

    margin-bottom:8px;

    font-size:14px;
    font-weight:700;

    color:#80536a;
}


/* ===== ورودی ها ===== */

input,
select,
textarea{

    width:100%;

    box-sizing:border-box;

    padding:14px 16px;

    border:1px solid #f1c5d6;

    border-radius:16px;

    background:#fffafd;

    color:#654452;

    font-family:"Vazirmatn",sans-serif;

    font-size:14px;

    outline:none;

    transition:.25s;

    box-shadow:0 4px 15px rgba(180,90,125,.05);
}


input:focus,
select:focus,
textarea:focus{

    border-color:#ee8db7;

    background:white;

    box-shadow:
        0 0 0 4px rgba(255,145,190,.12),
        0 8px 22px rgba(180,80,120,.08);

    transform:translateY(-1px);
}


textarea{
    min-height:95px;
    resize:vertical;
}


/* ===== دکمه رزرو ===== */

button[type="submit"]{

    width:100%;

    margin-top:8px;

    padding:16px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    font-family:"Vazirmatn",sans-serif;

    font-size:17px;
    font-weight:800;

    color:white;

    background:
        linear-gradient(
            135deg,
            #e85b91,
            #f486b4,
            #ffb3d0
        );

    box-shadow:
        0 10px 25px rgba(232,91,145,.30),
        0 0 20px rgba(255,180,210,.25);

    transition:.25s;
}


button[type="submit"]:hover{

    transform:translateY(-3px) scale(1.01);

    box-shadow:
        0 14px 32px rgba(232,91,145,.38),
        0 0 28px rgba(255,180,210,.35);
}


button[type="submit"]:active{
    transform:scale(.98);
}


/* ===== پیام موفقیت ===== */

#successMessage{

    margin-top:18px;

    padding:15px;

    border-radius:16px;

    text-align:center;

    background:#fff0f6;

    border:1px solid #f6c2d7;

    color:#9b4f72;

    font-weight:700;
}


/* ===== موبایل ===== */

@media(max-width:600px){

    body{
        padding:15px 10px;
    }

    .booking-card{
        padding:25px 18px;
        border-radius:25px;
    }

    h1{
        font-size:27px;
    }

}

</style> 

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        PARI LASH STUDIO
    </div>

    <h1>
        رزرو نوبت ✨
    </h1>

    <div class="subtitle">
        برای ثبت نوبت، اطلاعات خود را وارد کنید.
        <br>
        منتظر دیدارتان هستیم 🌸
    </div>

    <form id="bookingForm">

        <div class="form-group">

            <label for="name">
                نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="name"
                placeholder="مثلاً پری رضایی"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                شماره تماس
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="مثلاً 09123456789"
                required
            >

        </div>


        <div class="form-group">

            <label for="date">
                تاریخ موردنظر
            </label>

            <input
                type="text"
                id="date"
                placeholder="انتخاب تاریخ 📅"
                data-jdp
                autocomplete="off"
                readonly
                required
            >

        </div>


        <div class="form-group">

            <label for="service">
                نوع خدمات
            </label>

            <select id="service" required>

                <option value="">
                    انتخاب خدمات
                </option>

                <option value="اکستنشن مژه">
                    اکستنشن مژه
                </option>

                <option value="ترمیم مژه">
                    ترمیم مژه
                </option>

                <option value="لیفت مژه">
                    لیفت مژه
                </option>

                <option value="سایر">
                    سایر
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="description">
                توضیحات
            </label>

            <textarea
                id="description"
                placeholder="اگر توضیح خاصی دارید اینجا بنویسید..."
            ></textarea>

        </div>


        <button
            type="submit"
            id="submitBtn"
        >
            ثبت درخواست نوبت ✨
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back"
    >
        ← بازگشت به صفحه اصلی
    </a>

</div>


<!-- تقویم شمسی -->

<script src="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

<script>

jalaliDatepicker.startWatch({
    minDate: "attr",
    maxDate: "attr"
});

</script>


<!-- Firebase -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCn_Rx6fdxUO_E2eIYjNQaiPamSMntmshc",

    authDomain: "pari-lash-studio.firebaseapp.com",

    projectId: "pari-lash-studio",

    storageBucket: "pari-lash-studio.firebasestorage.app",

    messagingSenderId: "345811477312",

    appId: "1:345811477312:web:77b060a885ede8461490a5"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const form =
    document.getElementById("bookingForm");


const button =
    document.getElementById("submitBtn");


const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        button.disabled = true;

        button.textContent =
            "در حال ثبت...";


        message.className =
            "message";

        message.textContent = "";


        const name =
            document.getElementById("name")
            .value.trim();


        const phone =
            document.getElementById("phone")
            .value.trim();


        const date =
            document.getElementById("date")
            .value;


        const service =
            document.getElementById("service")
            .value;


        const description =
            document.getElementById("description")
            .value.trim();


        try{

            await addDoc(
                collection(db,"bookings"),
                {

                    name:name,

                    phone:phone,

                    date:date,

                    service:service,

                    description:description,

                    status:"در انتظار بررسی",

                    createdAt:
                        serverTimestamp()

                }
            );


            message.className =
                "message success";


            message.textContent =
                "درخواست شما با موفقیت ثبت شد 🌸";


            form.reset();


        }catch(error){

            console.error(error);


            message.className =
                "message error";


            message.textContent =
                "ثبت درخواست انجام نشد. لطفاً دوباره امتحان کنید.";

        }


        button.disabled = false;


        button.textContent =
            "ثبت درخواست نوبت ✨";

    }
);

</script>

</body>
</html>
