
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رزرو نوبت | Pari Lash Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:"Vazirmatn",Tahoma,sans-serif;
    background:linear-gradient(135deg,#fff8fb,#f8edf2);
    padding:25px 15px;
    color:#3d3036;
}

.container{
    width:100%;
    max-width:520px;
    margin:25px auto;
    background:rgba(255,255,255,.94);
    padding:30px 25px;
    border-radius:24px;
    box-shadow:0 15px 45px rgba(100,70,85,.12);
    border:1px solid rgba(190,150,170,.18);
}

.logo{
    text-align:center;
    font-size:14px;
    letter-spacing:2px;
    color:#a87991;
    margin-bottom:8px;
}

h1{
    text-align:center;
    margin:0 0 8px;
    font-size:27px;
    color:#4b3741;
}

.subtitle{
    text-align:center;
    color:#8d7780;
    font-size:13px;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#55434b;
}

input,
textarea,
select{
    width:100%;
    padding:14px 15px;
    border:1px solid #eadce2;
    border-radius:12px;
    background:#fff;
    color:#493b42;
    font-family:inherit;
    font-size:14px;
    outline:none;
    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#c69aae;
    box-shadow:0 0 0 3px rgba(198,154,174,.12);
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:13px;
    background:linear-gradient(135deg,#b9859c,#9f6d86);
    color:white;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 8px 20px rgba(159,109,134,.2);
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:12px;
    text-align:center;
    font-size:14px;
}

.success{
    display:block;
    background:#edf8f1;
    color:#39704d;
}

.error{
    display:block;
    background:#fff0f0;
    color:#9a4545;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#987087;
    text-decoration:none;
    font-size:13px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">PARI LASH STUDIO</div>

    <h1>رزرو نوبت</h1>

    <div class="subtitle">
        اطلاعات خود را وارد کنید تا درخواست نوبت شما ثبت شود.
    </div>

    <form id="bookingForm">

        <div class="form-group">
            <label for="name">نام و نام خانوادگی</label>
            <input
                type="text"
                id="name"
                placeholder="مثلاً پری رضایی"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">شماره تماس</label>
            <input
                type="tel"
                id="phone"
                placeholder="مثلاً 09123456789"
                required
            >
        </div>

        <div class="form-group">
            <label for="date">تاریخ موردنظر</label>
            <input
                type="date"
                id="date"
                required
            >
        </div>

        <div class="form-group">
            <label for="service">نوع خدمات</label>

            <select id="service" required>
                <option value="">انتخاب خدمات</option>
                <option value="اکستنشن مژه">اکستنشن مژه</option>
                <option value="ترمیم مژه">ترمیم مژه</option>
                <option value="لیفت مژه">لیفت مژه</option>
                <option value="سایر">سایر</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">توضیحات</label>

            <textarea
                id="description"
                placeholder="اگر توضیح خاصی دارید اینجا بنویسید..."
            ></textarea>
        </div>

        <button type="submit" id="submitBtn">
            ثبت درخواست نوبت
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← بازگشت به صفحه اصلی
    </a>

</div>


<!-- Firebase -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
========================================
کد firebaseConfig خودت را اینجا قرار بده
========================================
*/

const firebaseConfig = { apiKey: "AIzaSyCn_Rx6fdxUO_E2eIYjNQaiPamSMntmshc",
  authDomain: "pari-lash-studio.firebaseapp.com",
  projectId: "pari-lash-studio",
  storageBucket: "pari-lash-studio.firebasestorage.app",
  messagingSenderId: "345811477312",
  appId: "1:345811477312:web:77b060a885ede8461490a5"


    // کد firebaseConfig خودت را اینجا Paste کن

};


/*
========================================
اتصال Firebase
========================================
*/

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/*
========================================
فرم رزرو
========================================
*/

const form = document.getElementById("bookingForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event){

    event.preventDefault();

    button.disabled = true;
    button.textContent = "در حال ثبت...";

    message.className = "message";
    message.textContent = "";

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const date =
        document.getElementById("date").value;

    const service =
        document.getElementById("service").value;

    const description =
        document.getElementById("description").value.trim();


    try{

        await addDoc(collection(db, "bookings"), {

            name: name,
            phone: phone,
            date: date,
            service: service,
            description: description,

            status: "در انتظار بررسی",

            createdAt: serverTimestamp()

        });


        message.className = "message success";

        message.textContent =
            "درخواست شما با موفقیت ثبت شد 🌸";


        form.reset();


    }catch(error){

        console.error(error);

        message.className = "message error";

        message.textContent =
            "ثبت درخواست انجام نشد. لطفاً دوباره امتحان کنید.";

    }


    button.disabled = false;

    button.textContent = "ثبت درخواست نوبت";

});

</script>

</body>
</html>
