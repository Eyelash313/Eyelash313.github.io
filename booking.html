<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رزرو نوبت | Pari Lash Studio</title>

<style>
body{
    font-family:tahoma;
    background:#f8f4f6;
    padding:30px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#d4a373;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}
</style>
</head>

<body>

<div class="container">
<h1>رزرو نوبت</h1>

<form>
<input type="text" placeholder="نام و نام خانوادگی">

<input type="tel" placeholder="شماره تماس">

<input type="date">

<textarea placeholder="توضیحات"></textarea>

<button type="submit">
ثبت درخواست
</button>
</form>

</div>

</body>
</html>
