<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رزرو نوبت | Pari Lash Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.css">


   <style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px 15px;
    min-height:100vh;

    font-family:"Vazirmatn",sans-serif;

    background:
        radial-gradient(circle at 10% 10%,rgba(255,180,215,.55),transparent 35%),
        radial-gradient(circle at 90% 90%,rgba(255,215,232,.75),transparent 40%),
        linear-gradient(145deg,#fff3f8,#ffffff,#fff5f9);

    color:#5c3b4b;
}


/* پنل اصلی */

.container{
    width:100%;
    max-width:520px;

    margin:10px auto;

    padding:32px 26px;

    background:rgba(255,255,255,.92);

    border:1px solid rgba(235,135,175,.25);

    border-radius:30px;

    box-shadow:
        0 25px 65px rgba(110,55,80,.16),
        0 0 35px rgba(255,145,190,.18);

    position:relative;
    overflow:hidden;
}


/* نور تزئینی بالای پنل */

.container::before{
    content:"";

    position:absolute;

    top:-70px;
    right:-70px;

    width:170px;
    height:170px;

    border-radius:50%;

    background:rgba(255,180,215,.25);
}


/* لوگو */

.logo{
    text-align:center;

    font-family:"Playfair Display",serif;

    font-size:18px;

    font-weight:700;

    letter-spacing:2px;

    color:#a45276;

    margin-bottom:12px;
}


/* عنوان */

h1{
    position:relative;

    margin:0;

    text-align:center;

    font-family:"Playfair Display","Vazirmatn",serif;

    font-size:32px;

    color:#914866;
}


/* متن زیر عنوان */

.subtitle{
    text-align:center;

    margin:10px 0 25px;

    line-height:1.9;

    font-size:13px;

    color:#ad7b91;
}


/* خط تزئینی */

.subtitle::after{
    content:"";

    display:block;

    width:65px;
    height:3px;

    margin:15px auto 0;

    border-radius:10px;

    background:linear-gradient(
        90deg,
        #ff91bd,
        #ffd1e2,
        #ff91bd
    );
}


/* گروه فرم */

.form-group{
    margin-bottom:18px;
}


/* عنوان فیلد */

.form-group label{
    display:block;

    margin-bottom:8px;

    font-size:14px;

    font-weight:700;

    color:#774b61;
}


/* فیلدها */

input,
select,
textarea{

    width:100%;

    padding:14px 16px;

    border:1px solid #f0c5d6;

    border-radius:16px;

    background:#fffafd;

    color:#624251;

    font-family:"Vazirmatn",sans-serif;

    font-size:14px;

    outline:none;

    transition:.25s;

    box-shadow:
        0 4px 15px rgba(160,75,110,.05);
}


/* وقتی روی فیلد کلیک میشه */

input:focus,
select:focus,
textarea:focus{

    border-color:#ec83ae;

    background:#fff;

    box-shadow:
        0 0 0 4px rgba(255,145,190,.13),
        0 8px 25px rgba(170,75,110,.08);
}


/* توضیحات */

textarea{
    min-height:95px;

    resize:vertical;
}


/* دکمه */

button[type="submit"]{

    width:100%;

    margin-top:8px;

    padding:16px;

    border:0;

    border-radius:18px;

    cursor:pointer;

    font-family:"Vazirmatn",sans-serif;

    font-size:17px;

    font-weight:800;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #e95791,
            #f27caf,
            #ffafd0
        );

    box-shadow:
        0 12px 28px rgba(226,82,140,.30),
        0 0 22px rgba(255,175,210,.25);

    transition:.25s;
}


button[type="submit"]:hover{

    transform:translateY(-3px);

    box-shadow:
        0 16px 35px rgba(226,82,140,.40),
        0 0 30px rgba(255,175,210,.35);
}


button[type="submit"]:active{
    transform:scale(.98);
}


/* پیام */

.message{

    margin-top:18px;

    padding:14px;

    border-radius:15px;

    text-align:center;

    font-size:14px;
}


.message.success{

    background:#fff0f6;

    border:1px solid #f5bfd5;

    color:#974b6d;

    font-weight:700;
}


.message.error{

    background:#fff1f1;

    border:1px solid #f0c0c0;

    color:#a34d4d;
}


/* بازگشت */

.back{

    display:block;

    margin-top:20px;

    text-align:center;

    text-decoration:none;

    color:#a65a79;

    font-size:13px;

    transition:.2s;
}


.back:hover{
    color:#e35491;
}


/* موبایل */

@media(max-width:600px){

    body{
        padding:12px 8px;
    }

    .container{
        padding:26px 18px;

        border-radius:25px;
    }

    h1{
        font-size:28px;
    }

    .logo{
        font-size:16px;
    }

}

</style>



            


</head>

<body>

<div class="container">

    <div class="logo">
        PARI LASH STUDIO
    </div>

    <h1>
        رزرو نوبت ✨
    </h1>

    <div class="subtitle">
        برای ثبت نوبت، اطلاعات خود را وارد کنید.
        <br>
        منتظر دیدارتان هستیم 🌸
    </div>

    <form id="bookingForm">

        <div class="form-group">

            <label for="name">
                نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="name"
                placeholder="مثلاً پری رضایی"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                شماره تماس
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="مثلاً 09123456789"
                required
            >

        </div>


        <div class="form-group">

            <label for="date">
                تاریخ موردنظر
            </label>

            <input
                type="text"
                id="date"
                placeholder="انتخاب تاریخ 📅"
                data-jdp
                autocomplete="off"
                readonly
                required
            >

        </div>


        <div class="form-group">

            <label for="service">
                نوع خدمات
            </label>

            <select id="service" required>

                <option value="">
                    انتخاب خدمات
                </option>

                <option value="اکستنشن مژه">
                    اکستنشن مژه
                </option>

                <option value="ترمیم مژه">
                    ترمیم مژه
                </option>

                <option value="لیفت مژه">
                    لیفت مژه
                </option>

                <option value="سایر">
                    سایر
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="description">
                توضیحات
            </label>

            <textarea
                id="description"
                placeholder="اگر توضیح خاصی دارید اینجا بنویسید..."
            ></textarea>

        </div>


        <button
            type="submit"
            id="submitBtn"
        >
            ثبت درخواست نوبت ✨
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back"
    >
        ← بازگشت به صفحه اصلی
    </a>

</div>


<!-- تقویم شمسی -->

<script src="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

<script>

jalaliDatepicker.startWatch({
    minDate: "attr",
    maxDate: "attr"
});

</script>


<!-- Firebase -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCn_Rx6fdxUO_E2eIYjNQaiPamSMntmshc",

    authDomain: "pari-lash-studio.firebaseapp.com",

    projectId: "pari-lash-studio",

    storageBucket: "pari-lash-studio.firebasestorage.app",

    messagingSenderId: "345811477312",

    appId: "1:345811477312:web:77b060a885ede8461490a5"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const form =
    document.getElementById("bookingForm");


const button =
    document.getElementById("submitBtn");


const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        button.disabled = true;

        button.textContent =
            "در حال ثبت...";


        message.className =
            "message";

        message.textContent = "";


        const name =
            document.getElementById("name")
            .value.trim();


        const phone =
            document.getElementById("phone")
            .value.trim();


        const date =
            document.getElementById("date")
            .value;


        const service =
            document.getElementById("service")
            .value;


        const description =
            document.getElementById("description")
            .value.trim();


        try{

            await addDoc(
                collection(db,"bookings"),
                {

                    name:name,

                    phone:phone,

                    date:date,

                    service:service,

                    description:description,

                    status:"در انتظار بررسی",

                    createdAt:
                        serverTimestamp()

                }
            );


            message.className =
                "message success";


            message.textContent =
                "درخواست شما با موفقیت ثبت شد 🌸";


            form.reset();


        }catch(error){

            console.error(error);


            message.className =
                "message error";


            message.textContent =
                "ثبت درخواست انجام نشد. لطفاً دوباره امتحان کنید.";

        }


        button.disabled = false;


        button.textContent =
            "ثبت درخواست نوبت ✨";

    }
);

</script>

</body>
</html>
