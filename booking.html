   <style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px 15px;
    min-height:100vh;

    font-family:"Vazirmatn",sans-serif;

    background:
        radial-gradient(circle at 15% 15%,rgba(255,190,220,.65),transparent 28%),
        radial-gradient(circle at 85% 80%,rgba(205,220,255,.55),transparent 30%),
        linear-gradient(135deg,#fff0f7,#fdfaff,#f1f3ff);

    color:#463746;
}


/* ===== پنل اصلی الماسی ===== */

.container{
    width:100%;
    max-width:560px;

    margin:15px auto;

    padding:38px 32px;

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.97),
            rgba(250,246,255,.96)
        );

    border-radius:34px;

    border:2px solid rgba(224,178,211,.65);

    box-shadow:
        0 25px 70px rgba(82,55,90,.20),
        0 0 0 5px rgba(255,255,255,.65),
        0 0 40px rgba(224,150,205,.20);

    overflow:hidden;
}


/* درخشش گوشه‌های پنل */

.container::before{
    content:"✦";

    position:absolute;

    top:12px;
    right:20px;

    font-size:28px;

    color:#d9a8cf;

    opacity:.65;
}


.container::after{
    content:"✦";

    position:absolute;

    bottom:15px;
    left:20px;

    font-size:24px;

    color:#e8b6d5;

    opacity:.6;
}


/* ===== لوگو ===== */

.logo{
    text-align:center;

    font-family:"Playfair Display",serif;

    font-size:21px;

    font-weight:700;

    letter-spacing:3px;

    color:#9a5278;

    margin-bottom:15px;

    text-shadow:
        0 3px 15px rgba(180,90,140,.20);
}


/* ===== عنوان ===== */

h1{
    margin:0;

    text-align:center;

    font-family:"Playfair Display","Vazirmatn",serif;

    font-size:38px;

    line-height:1.4;

    color:#783d62;

    text-shadow:
        0 3px 18px rgba(120,60,100,.13);
}


/* ===== توضیح ===== */

.subtitle{
    margin:13px 0 30px;

    text-align:center;

    font-size:16px;

    line-height:2;

    color:#806479;
}


/* الماس‌های تزئینی */

.subtitle::before{
    content:"◇  ✦  ◇";

    display:block;

    margin-bottom:8px;

    font-size:18px;

    letter-spacing:7px;

    color:#c88ab0;
}


/* ===== گروه‌ها ===== */

.form-group{
    margin-bottom:23px;
}


/* ===== نوشته‌های فیلد ===== */

.form-group label{
    display:block;

    margin-bottom:10px;

    font-size:16px;

    font-weight:800;

    color:#663e56;
}


/* ===== کادرهای ورودی ===== */

input,
select,
textarea{

    width:100%;

    padding:17px 18px;

    border-radius:18px;

    border:2px solid #e8c5da;

    background:
        linear-gradient(
            135deg,
            #fffafd,
            #fdf9ff
        );

    color:#4d3b48;

    font-family:"Vazirmatn",sans-serif;

    font-size:16px;

    outline:none;

    transition:.25s;

    box-shadow:
        0 6px 20px rgba(100,65,95,.07),
        inset 0 1px 5px rgba(255,255,255,.9);
}


/* فوکوس */

input:focus,
select:focus,
textarea:focus{

    border-color:#c989ad;

    background:#fff;

    transform:translateY(-2px);

    box-shadow:
        0 0 0 5px rgba(205,137,174,.12),
        0 10px 28px rgba(110,65,95,.12);
}


/* placeholder */

input::placeholder,
textarea::placeholder{
    color:#b29aaa;
}


/* توضیحات */

textarea{
    min-height:125px;

    resize:vertical;

    line-height:1.8;
}


/* ===== دکمه الماسی ===== */

button[type="submit"]{

    width:100%;

    margin-top:8px;

    padding:18px 20px;

    border:0;

    border-radius:20px;

    cursor:pointer;

    font-family:"Vazirmatn",sans-serif;

    font-size:18px;

    font-weight:900;

    color:white;

    background:
        linear-gradient(
            135deg,
            #9d527d 0%,
            #d16c9d 45%,
            #eaa2c4 75%,
            #b978a5 100%
        );

    box-shadow:
        0 12px 30px rgba(145,70,110,.32),
        0 0 25px rgba(226,150,190,.25);

    transition:.25s;

    position:relative;

    overflow:hidden;
}


/* برق روی دکمه */

button[type="submit"]::after{
    content:"✦";

    position:absolute;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    font-size:22px;

    opacity:.75;
}


button[type="submit"]:hover{

    transform:translateY(-3px);

    box-shadow:
        0 17px 40px rgba(145,70,110,.40),
        0 0 35px rgba(226,150,190,.35);
}


button[type="submit"]:active{
    transform:scale(.98);
}


/* ===== پیام ===== */

.message{
    margin-top:20px;

    padding:16px;

    border-radius:18px;

    text-align:center;

    font-size:15px;

    line-height:1.7;
}


.message.success{

    background:linear-gradient(
        135deg,
        #fff0f7,
        #f9f0ff
    );

    border:1px solid #e8bfd7;

    color:#814563;

    font-weight:800;
}


.message.error{

    background:#fff1f3;

    border:1px solid #e9b9c2;

    color:#a24759;
}


/* ===== بازگشت ===== */

.back{

    display:block;

    margin-top:23px;

    text-align:center;

    text-decoration:none;

    font-size:15px;

    font-weight:700;

    color:#9a5278;

    transition:.2s;
}


.back:hover{
    color:#d05291;
}


/* ===== موبایل ===== */

@media(max-width:600px){

    body{
        padding:12px 8px;
    }

    .container{
        padding:30px 20px;

        border-radius:28px;
    }

    .logo{
        font-size:18px;
    }

    h1{
        font-size:32px;
    }

    .subtitle{
        font-size:15px;
    }

    .form-group label{
        font-size:15px;
    }

    input,
    select,
    textarea{
        font-size:16px;

        padding:16px;
    }

    button[type="submit"]{
        font-size:17px;
    }

}

</style>

    </form>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCn_Rx6fdxUO_E2eIYjNQaiPamSMntmshc",

    authDomain: "pari-lash-studio.firebaseapp.com",

    projectId: "pari-lash-studio",

    storageBucket: "pari-lash-studio.firebasestorage.app",

    messagingSenderId: "345811477312",

    appId: "1:345811477312:web:77b060a885ede8461490a5"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const form =
    document.getElementById("bookingForm");


const button =
    document.getElementById("submitBtn");


const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        button.disabled = true;

        button.textContent =
            "در حال ثبت...";


        message.className =
            "message";

        message.textContent = "";


        const name =
            document.getElementById("name")
            .value.trim();


        const phone =
            document.getElementById("phone")
            .value.trim();


        const date =
            document.getElementById("date")
            .value;


        const service =
            document.getElementById("service")
            .value;


        const description =
            document.getElementById("description")
            .value.trim();


        try{

            await addDoc(
                collection(db,"bookings"),
                {

                    name:name,

                    phone:phone,

                    date:date,

                    service:service,

                    description:description,

                    status:"در انتظار بررسی",

                    createdAt:
                        serverTimestamp()

                }
            );


            message.className =
                "message success";


            message.textContent =
                "درخواست شما با موفقیت ثبت شد 🌸";


            form.reset();


        }catch(error){

            console.error(error);


            message.className =
                "message error";


            message.textContent =
                "ثبت درخواست انجام نشد. لطفاً دوباره امتحان کنید.";

        }


        button.disabled = false;


        button.textContent =
            "ثبت درخواست نوبت ✨";

    }
);

</script>
